<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="Offline bicycle router powered by WebAssembly" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <title>rsrouter</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #map {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #controls {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        max-width: 320px;
        width: calc(100% - 32px);
      }
      #controls h1 {
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: #0f172a;
      }
      #controls p {
        font-size: 0.85rem;
        color: #475569;
        margin-bottom: 12px;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
      .field select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.9rem;
        background: #fff;
      }
      #status {
        font-size: 0.8rem;
        padding: 6px 10px;
        border-radius: 6px;
        background: #f1f5f9;
        color: #334155;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <h1>rsrouter</h1>
      <p>Offline WebAssembly bicycle routing.</p>
      <div class="field">
        <label for="profile-select">Profile</label>
        <select id="profile-select">
          <option value="fastbike">Fastbike</option>
          <option value="fastbike-lowtraffic" selected>Fastbike Low Traffic</option>
          <option value="fastbike-verylowtraffic">Fastbike Very Low Traffic</option>
        </select>
      </div>
      <div id="status">Click on the map to set start and end points.</div>
    </div>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
