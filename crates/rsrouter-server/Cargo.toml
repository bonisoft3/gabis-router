[package]
name = "rsrouter-server"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Drop-in BRouter HTTP API server in Rust"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "compare_routes"
path = "src/bin/compare_routes.rs"

[[bin]]
name = "plot_routes"
path = "src/bin/plot_routes.rs"

[dependencies]
rsrouter-core = { path = "../rsrouter-core" }
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
