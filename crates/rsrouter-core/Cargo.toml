[package]
name = "rsrouter-core"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Pure BRouter bicycle routing engine in idiomatic Rust"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
