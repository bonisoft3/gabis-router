[package]
name = "rsrouter-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "WebAssembly bindings for rsrouter routing engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsrouter-core = { path = "../rsrouter-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
